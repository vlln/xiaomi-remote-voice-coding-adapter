<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>遥控器按键圈对齐</title>
  <style>
    :root { color-scheme: light; --accent:#ff6900; --line:#e7e7ec; --muted:#7b8087; }
    * { box-sizing: border-box; }
    body { margin:0; padding:24px; font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; color:#1b1b1f; background:#f5f6f8; }
    h1 { margin:0 0 4px; font-size:20px; }
    p { margin:0 0 14px; color:var(--muted); }
    .layout { display:flex; gap:28px; align-items:flex-start; }
    .stage-wrap { padding:12px; border:1px solid var(--line); border-radius:16px; background:#fff; box-shadow:0 8px 30px rgba(0,0,0,.06); }
    .stage { position:relative; width:310px; height:960px; user-select:none; }
    .stage img { display:block; width:310px; height:960px; pointer-events:none; }
    .ring { position:absolute; width:34px; height:34px; margin:-17px 0 0 -17px; border:2px solid var(--accent); border-radius:50%; background:rgba(255,105,0,.13); cursor:grab; touch-action:none; }
    .ring:active { cursor:grabbing; background:rgba(255,105,0,.28); }
    .ring span { position:absolute; left:50%; top:calc(100% + 5px); transform:translateX(-50%); white-space:nowrap; padding:2px 6px; border-radius:4px; color:#fff; background:#191919; font-size:11px; }
    .panel { width:360px; display:flex; flex-direction:column; gap:12px; }
    .card { padding:14px; border:1px solid var(--line); border-radius:12px; background:#fff; }
    .row { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:5px 0; border-bottom:1px dashed #efeff3; font-variant-numeric:tabular-nums; }
    .row:last-child { border-bottom:0; }
    .row b { font-weight:600; }
    code { color:#b84a00; }
    button { border:1px solid var(--line); border-radius:8px; background:#fff; padding:8px 12px; font:inherit; cursor:pointer; }
    button.primary { color:#fff; border-color:var(--accent); background:var(--accent); }
    .buttons { display:flex; gap:8px; flex-wrap:wrap; }
    textarea { width:100%; height:170px; resize:vertical; border:1px solid var(--line); border-radius:8px; padding:10px; font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
    .hint { color:var(--muted); font-size:12px; }
  </style>
</head>
<body>
  <h1>遥控器按键圈对齐</h1>
  <p>把 5 个橙圈拖到遥控器对应的按钮中心。百分比会实时更新，拖好后点「复制结果」发给我。</p>
  <div class="layout">
    <div class="stage-wrap">
      <div class="stage" id="stage">
        <img src="../public/remote-2.jpg" alt="小米遥控器 2" />
      </div>
    </div>
    <div class="panel">
      <div class="card" id="readout"></div>
      <div class="card">
        <div class="buttons">
          <button class="primary" id="copy">复制结果</button>
          <button id="reset">恢复当前值</button>
          <button id="save">保存到浏览器</button>
        </div>
        <p class="hint" style="margin:10px 0 0">当前值会保存在浏览器 localStorage；刷新不丢。</p>
      </div>
      <div class="card">
        <div style="font-weight:600;margin-bottom:8px">可直接粘贴给我</div>
        <textarea id="output" readonly></textarea>
      </div>
    </div>
  </div>
<script>
  const INITIAL = {
    voice: { top: 11.5, left: 66.5, label: "语音键" },
    back: { top: 39.7, left: 33.7, label: "返回键" },
    home: { top: 48.3, left: 34.2, label: "Home 键" },
    tv: { top: 56.7, left: 63.0, label: "TV 键" },
    menu: { top: 56.8, left: 33.8, label: "菜单键" }
  };
  const KEY = "xiaomi-remote-hotspots-v1";
  const stage = document.getElementById("stage");
  const readout = document.getElementById("readout");
  const output = document.getElementById("output");
  let state = load();

  function load() {
    try {
      const saved = JSON.parse(localStorage.getItem(KEY) || "null");
      if (saved && Object.keys(INITIAL).every((k) => saved[k])) return saved;
    } catch {}
    return JSON.parse(JSON.stringify(INITIAL));
  }

  function render() {
    stage.querySelectorAll(".ring").forEach((el) => el.remove());
    Object.entries(state).forEach(([key, pos]) => {
      const el = document.createElement("button");
      el.className = "ring";
      el.dataset.key = key;
      el.style.left = pos.left + "%";
      el.style.top = pos.top + "%";
      el.title = pos.label;
      el.innerHTML = `<span>${pos.label}</span>`;
      el.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        el.setPointerCapture(event.pointerId);
        const move = (e) => {
          const rect = stage.getBoundingClientRect();
          const left = Math.min(100, Math.max(0, ((e.clientX - rect.left) / rect.width) * 100));
          const top = Math.min(100, Math.max(0, ((e.clientY - rect.top) / rect.height) * 100));
          state[key].left = Math.round(left * 10) / 10;
          state[key].top = Math.round(top * 10) / 10;
          el.style.left = state[key].left + "%";
          el.style.top = state[key].top + "%";
          updateReadout();
        };
        const up = () => {
          el.removeEventListener("pointermove", move);
          el.removeEventListener("pointerup", up);
          localStorage.setItem(KEY, JSON.stringify(state));
        };
        el.addEventListener("pointermove", move);
        el.addEventListener("pointerup", up);
      });
      stage.appendChild(el);
    });
    updateReadout();
  }

  function updateReadout() {
    readout.innerHTML = Object.entries(state)
      .map(([key, p]) => `<div class="row"><b>${p.label}</b><span>top <code>${p.top.toFixed(1)}%</code> · left <code>${p.left.toFixed(1)}%</code></span></div>`)
      .join("");
    output.value = JSON.stringify(
      Object.fromEntries(Object.entries(state).map(([k, p]) => [k, { top: p.top.toFixed(1), left: p.left.toFixed(1) }])),
      null,
      2
    );
  }

  document.getElementById("reset").onclick = () => {
    state = JSON.parse(JSON.stringify(INITIAL));
    localStorage.setItem(KEY, JSON.stringify(state));
    render();
  };
  document.getElementById("save").onclick = () => {
    localStorage.setItem(KEY, JSON.stringify(state));
    document.getElementById("save").textContent = "已保存";
    setTimeout(() => (document.getElementById("save").textContent = "保存到浏览器"), 1200);
  };
  document.getElementById("copy").onclick = async () => {
    try {
      await navigator.clipboard.writeText(output.value);
      document.getElementById("copy").textContent = "已复制";
      setTimeout(() => (document.getElementById("copy").textContent = "复制结果"), 1200);
    } catch {
      output.focus();
      output.select();
      document.execCommand("copy");
    }
  };

  render();
</script>
</body>
</html>
