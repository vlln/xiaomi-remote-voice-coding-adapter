name: v1-tests

on:
  push:
    paths:
      - "v1/**"
      - ".github/workflows/v1-tests.yml"
  pull_request:
    paths:
      - "v1/**"

jobs:
  test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install V1 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy sounddevice pyobjc-framework-CoreBluetooth

      - name: V1 tests
        run: python -m unittest discover -s tests -v
