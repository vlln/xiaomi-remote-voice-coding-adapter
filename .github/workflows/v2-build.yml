name: v2-build

on:
  push:
    paths:
      - "v2/**"
      - ".github/workflows/v2-build.yml"
  pull_request:
    paths:
      - "v2/**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle: dmg
          - os: windows-latest
            bundle: nsis
          - os: ubuntu-22.04
            bundle: deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: v2/src-tauri

      - name: Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libudev-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Core tests
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

      - name: Build
        run: pnpm tauri build --bundles ${{ matrix.bundle }}

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-remote-v2-${{ matrix.os }}
          path: |
            v2/src-tauri/target/release/bundle/**
            v2/src-tauri/target/release/xiaomi-remote-v2
            v2/src-tauri/target/release/xiaomi-remote-v2.exe
          if-no-files-found: warn
