name: v2-release

on:
  push:
    tags:
      - "v2.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: dmg
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: v2/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: v2/src-tauri

      - name: Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libudev-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Core tests
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

      - name: Build
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-remote-v2-${{ matrix.os }}
          path: |
            v2/src-tauri/target/release/bundle/dmg/*.dmg
            v2/src-tauri/target/release/bundle/nsis/*.exe
            v2/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            v2/src-tauri/target/release/bundle/dmg/*.dmg
            v2/src-tauri/target/release/bundle/nsis/*.exe
            v2/src-tauri/target/release/bundle/deb/*.deb
